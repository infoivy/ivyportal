name: IvyPortal
options:
  bundleIdPrefix: com.ivysalesacademy.dev
  deploymentTarget:
    iOS: "18.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  IvyPortal:
    type: application
    platform: iOS
    sources:
      - path: IvyPortal
      - path: IvyPortalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivysalesacademy.dev.IvyPortal
        PRODUCT_NAME: IvyPortal
        INFOPLIST_KEY_CFBundleDisplayName: Ivy Portal
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - package: Supabase
        product: Supabase
  IvyPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IvyPortalTests
    dependencies:
      - target: IvyPortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivysalesacademy.dev.IvyPortalTests
  IvyPortalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IvyPortalUITests
    dependencies:
      - target: IvyPortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivysalesacademy.dev.IvyPortalUITests
schemes:
  IvyPortal:
    build:
      targets:
        IvyPortal: all
        IvyPortalTests: [test]
        IvyPortalUITests: [test]
    test:
      targets:
        - IvyPortalTests
        - IvyPortalUITests

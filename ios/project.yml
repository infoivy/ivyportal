name: IvyPortal
options:
  # Final shipping identifier (locked at first App Store Connect upload).
  bundleIdPrefix: com.ivysalesacademy
  deploymentTarget:
    iOS: "18.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  IvyPortal:
    type: application
    platform: iOS
    sources:
      - path: IvyPortal
        excludes:
          - "Config/PortalConfig.example.swift"
      - path: IvyPortalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivysalesacademy.ivyportal
        PRODUCT_NAME: IvyPortal
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: IvyPortal/Info.plist
      properties:
        CFBundleDisplayName: Bun
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Launch matches the onboarding splash ground (no white flash).
        UILaunchScreen:
          UIColorName: LaunchGround
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # No custom encryption beyond HTTPS — skips the TestFlight export
        # compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Google sign-in (Supabase OAuth) returns to ivyportal://auth-callback
        CFBundleURLTypes:
          - CFBundleURLName: com.ivysalesacademy.ivyportal
            CFBundleURLSchemes: [ivyportal]
        # Mercury rework (founder 2026-08-17): Apercu Pro is the app typeface.
        UIAppFonts:
          - Apercu Pro Light.otf
          - Apercu Pro Regular.otf
          - Apercu Pro Medium.otf
          - Apercu Pro Bold.otf
          - Apercu Pro Mono.otf
    dependencies:
      - package: Supabase
        product: Supabase
  IvyPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IvyPortalTests
    dependencies:
      - target: IvyPortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivysalesacademy.ivyportal.tests
  IvyPortalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IvyPortalUITests
    dependencies:
      - target: IvyPortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivysalesacademy.ivyportal.uitests
schemes:
  IvyPortal:
    build:
      targets:
        IvyPortal: all
        IvyPortalTests: [test]
        IvyPortalUITests: [test]
    test:
      targets:
        - IvyPortalTests
        - IvyPortalUITests
